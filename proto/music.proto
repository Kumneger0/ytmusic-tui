syntax = "proto3";

package ytmusic_tui.music.v1;

option go_package = "github.com/kumneger0/ytmusic-tui/gen";

service MusicService {
  rpc Login(LoginRequest) returns (LoginResponse);

  rpc GetLibrary(GetLibraryRequest) returns (GetLibraryResponse);
  rpc GetUserSavedTracks(GetUserSavedTracksRequest) returns (GetUserSavedTracksResponse);
  rpc GetUserSavedAlbums(GetUserSavedAlbumsRequest) returns (GetUserSavedAlbumsResponse);
  rpc GetUserPlaylists(GetUserPlaylistsRequest) returns (GetUserPlaylistsResponse);

  rpc GetTrack(GetTrackRequest) returns (GetTrackResponse);
  rpc GetAlbumTracks(GetAlbumTracksRequest) returns (GetAlbumTracksResponse);
  rpc GetPlaylistItems(GetPlaylistItemsRequest) returns (GetPlaylistItemsResponse);

  rpc GetSearchResults(GetSearchResultsRequest) returns (GetSearchResultsResponse);

  rpc GetArtistTopTracks(GetArtistTopTracksRequest) returns (GetArtistTopTracksResponse);
  rpc GetFollowedArtists(GetFollowedArtistsRequest) returns (GetFollowedArtistsResponse);

  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
  rpc GetUserTopItems(GetUserTopItemsRequest) returns (GetUserTopItemsResponse);

  rpc CheckUserSavedTrack(CheckUserSavedTrackRequest) returns (CheckUserSavedTrackResponse);
  rpc SaveRemoveTrack(SaveRemoveTrackRequest) returns (SaveRemoveTrackResponse);

  rpc LikeSong(LikeSongRequest) returns (LikeSongResponse);
  rpc UnlikeSong(UnlikeSongRequest) returns (UnlikeSongResponse);

  rpc SearchSongs(SearchSongsRequest) returns (SearchSongsResponse);
  rpc GetVideoStreamURLAndDuration(GetVideoStreamURLAndDurationRequest) returns (GetVideoStreamURLAndDurationResponse);

  rpc GetHomePage(GetHomePageRequest) returns (GetHomePageResponse);
  rpc GetSongRelated(GetSongRelatedRequest) returns (GetSongRelatedResponse);
  rpc GetLyrics(GetLyricsRequest) returns (GetLyricsResponse);
  rpc CreatePlaylist(CreatePlaylistRequest) returns (CreatePlaylistResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
}

message HealthCheckRequest {}
message HealthCheckResponse {
  bool ok = 1;
}

message Song {
  string video_id = 1;
  string title = 2;
  repeated Artist artists = 3;
  string album = 4;
  string album_id = 5;
  int32 duration_seconds = 6;
  bool liked = 7;
  repeated Thumbnail thumbnails = 8;
  bool is_explicit = 9;
  string url = 10;
}

message Artist {
  string id = 1;
  string name = 2;
}

message Thumbnail {
  string url = 1;
  int32 width = 2;
  int32 height = 3;
}

message Album {
  string browse_id = 1;
  string title = 2;
  repeated Artist artists = 3;
  string year = 4;
  repeated Thumbnail thumbnails = 5;
  bool is_explicit = 6;
  string type = 7;
}

message LibraryChannel {
  string browse_id = 1;
  string name = 2;
  string subscribers = 3;
  repeated Thumbnail thumbnails = 4;
}

message Playlist {
  string playlist_id = 1;
  string title = 2;
  string description = 3;
  int32 count = 4;
  repeated Thumbnail thumbnails = 5;
  string author = 6;
}

message UserProfile {
  string channel_id = 1;
  string name = 2;
  repeated Thumbnail thumbnails = 3;
}

message LoginRequest {}

message LoginResponse {
  bool authenticated = 1;
}

message GetLibraryRequest {
  int32 limit = 1;
  string continuation = 2;
}

message Podcast {
  string podcast_id = 1;
  string title = 2;
  string author = 3;
  repeated Thumbnail thumbnails = 4;
}

message GetLibraryResponse {
  repeated Song songs = 1;
  repeated Album albums = 3;
  repeated Playlist playlists = 4;
  repeated LibraryChannel channels = 5;
  repeated FollowedArtist artists = 6;
  repeated Podcast podcasts = 7;
}

message GetUserSavedTracksRequest {
  int32 limit = 1;
}

message GetUserSavedTracksResponse {
  repeated Song tracks = 1;
  int32 total = 2;
}

message GetUserSavedAlbumsRequest {
  int32 limit = 1;
}

message GetUserSavedAlbumsResponse {
  repeated Album albums = 1;
  int32 total = 2;
}

message GetUserPlaylistsRequest {
  int32 limit = 1;
}

message GetUserPlaylistsResponse {
  repeated Playlist playlists = 1;
  int32 total = 2;
}

message GetTrackRequest {
  string video_id = 1;
}

message GetTrackResponse {
  Song track = 1;
}

message GetAlbumTracksRequest {
  string browse_id = 1;
}

message GetAlbumTracksResponse {
  string title = 1;
  repeated Artist artists = 2;
  string year = 3;
  repeated Thumbnail thumbnails = 4;
  repeated Song tracks = 5;
  int32 total = 6;
  string description = 7;
}

message GetPlaylistItemsRequest {
  string playlist_id = 1;
  int32 limit = 2;
}

message GetPlaylistItemsResponse {
  string title = 1;
  string description = 2;
  string author = 3;
  string year = 4;
  int32 track_count = 5;
  repeated Thumbnail thumbnails = 6;
  repeated Song tracks = 7;
}

message GetSearchResultsRequest {
  string query = 1;
  string filter = 2;
  int32 limit = 3;
}

message SearchResultSong {
  string video_id = 1;
  string title = 2;
  repeated Artist artists = 3;
  string album = 4;
  string album_id = 5;
  int32 duration_seconds = 6;
  bool liked = 7;
  repeated Thumbnail thumbnails = 8;
  bool is_explicit = 9;
  string url = 10;
}

message SearchResultAlbum {
  string browse_id = 1;
  string title = 2;
  repeated Artist artists = 3;
  string year = 4;
  string type = 5;
  repeated Thumbnail thumbnails = 6;
  bool is_explicit = 7;
}

message SearchResultArtist {
  string browse_id = 1;
  string name = 2;
  string subscribers = 3;
  repeated Thumbnail thumbnails = 4;
}

message SearchResultPlaylist {
  string browse_id = 1;
  string title = 2;
  string author = 3;
  string item_count = 4;
  repeated Thumbnail thumbnails = 5;
}

message SearchResultPodcast {
  string browse_id = 1;
  string title = 2;
  string author = 3;
  repeated Thumbnail thumbnails = 4;
}

message SearchResultEpisode {
  string video_id = 1;
  string title = 2;
  string podcast_name = 3;
  string podcast_id = 4;
  string date = 5;
  repeated Thumbnail thumbnails = 6;
}

message GetSearchResultsResponse {
  repeated SearchResultSong songs = 1;
  repeated SearchResultAlbum albums = 2;
  repeated SearchResultArtist artists = 3;
  repeated SearchResultPlaylist playlists = 4;
  repeated SearchResultPodcast podcasts = 5;
  repeated SearchResultEpisode episodes = 6;
}

message GetArtistTopTracksRequest {
  string channel_id = 1;
}

message GetArtistTopTracksResponse {
  string name = 1;
  repeated Thumbnail thumbnails = 2;
  string subscribers = 3;
  repeated Song tracks = 4;
}

message GetFollowedArtistsRequest {
  int32 limit = 1;
}

message FollowedArtist {
  string channel_id = 1;
  string name = 2;
  string subscribers = 3;
  repeated Thumbnail thumbnails = 4;
}

message GetFollowedArtistsResponse {
  repeated FollowedArtist artists = 1;
  int32 total = 2;
}

message GetUserProfileRequest {}

message GetUserProfileResponse {
  string channel_id = 1;
  string name = 2;
  repeated Thumbnail thumbnails = 3;
}

message GetUserTopItemsRequest {
  int32 limit = 1;
}

message GetUserTopItemsResponse {
  repeated Song tracks = 1;
  int32 total = 2;
}

message CheckUserSavedTrackRequest {
  string video_id = 1;
}

message CheckUserSavedTrackResponse {
  bool is_saved = 1;
}

message SaveRemoveTrackRequest {
  repeated string video_ids = 1;
  bool is_remove = 2;
}

message SaveRemoveTrackResponse {}

message LikeSongRequest {
  string video_id = 1;
}

message LikeSongResponse {}

message UnlikeSongRequest {
  string video_id = 1;
}

message UnlikeSongResponse {}

message SearchSongsRequest {
  string query = 1;
  int32 limit = 2;
}

message SearchSongsResponse {
  repeated Song songs = 1;
}

message GetHomePageRequest {}

message GetHomePageResponse {
  repeated HomePageSection sections = 1;
}

message HomePageSection {
  string title = 1;
  repeated HomePageContent contents = 2;
}

message HomePageContent {
  string title = 1;
  string playlist_id = 2;
  repeated Thumbnail thumbnails = 3;
  string description = 4;
  string video_id = 5;
  string browse_id = 6;
  string content_type = 7;
}

message GetVideoStreamURLAndDurationRequest {
  string videoId = 1;
}

message GetVideoStreamURLAndDurationResponse {
  string url = 1;
  string duration = 2;
}

message GetSongRelatedRequest {
  string videoId = 1;
  string browse_id = 2;
}

message GetSongRelatedResponse {
  repeated SongRelatedSection sections = 1;
}

message SongRelatedSection {
  string title = 1;
  repeated SongRelatedContent contents = 2;
  string text_content = 3;
}

message SongRelatedContent {
  string title = 1;
  string video_id = 2;
  string playlist_id = 3;
  string browse_id = 4;
  repeated Artist artists = 5;
  repeated Thumbnail thumbnails = 6;
  bool is_explicit = 7;
  string album = 8;
  string album_id = 9;
  string description = 10;
  string subscribers = 11;
  string year = 12;
  string content_type = 13;
}

message GetLyricsRequest {
  string videoId = 1;
  bool timestamps = 2;
}

message LyricLine {
  string text = 1;
  int32 start_time = 2;
  int32 end_time = 3;
  int32 id = 4;
}

message GetLyricsResponse {
  string lyrics = 1;
  string source = 2;
  bool has_timestamps = 3;
  repeated LyricLine lines = 4;
}

message CreatePlaylistRequest {
  string title = 1;
  string description = 2;
  string privacy_status = 3;
  repeated string video_ids = 4;
  string source_playlist = 5;
}

message CreatePlaylistResponse {
  string playlist_id = 1;
  bool success = 2;
  string error = 3;
}