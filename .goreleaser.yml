version: 2
project_name: ytmusic-tui

env:
  - GO111MODULE=on

before:
  hooks:
    - ./scripts/manpages.sh
    - ./scripts/completions.sh

builds:
  - id: ytmusic-tui
    main: .
    ldflags:
      - -s -w -X main.version={{ .Version }} -X main.serverURL={{ .Env.SERVER_URL }}
    binary: ytmusic-tui
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - 386

    ignore:
      - goos: linux
        goarch: arm64
      - goos: linux
        goarch: "386"
      - goos: darwin
        goarch: amd64
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: arm64
      - goos: windows
        goarch: "386"
    

    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CGO_ENABLED=1 
          - CC=gcc

archives:
  - ids:
      - ytmusic-tui
    format_overrides: []
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

nfpms:
  - ids:
      - ytmusic-tui
    vendor: kumneger0
    homepage: https://github.com/kumneger0/ytmusic-tui
    maintainer: "Kumneger wondimu <Kumnegerwondimu@gmail.com>"
    description: "CLI-based Spotify client"
    license: GPL-3.0
    formats:
      - apk
      - deb
      - rpm
    bindir: /usr/bin
    contents:
      - src: ./manpages/ytmusic-tui.1.gz
        dst: /usr/share/man/man1/ytmusic-tui.1.gz
        file_info:
          mode: 0644
      - src: ./completions/ytmusic-tui.bash
        dst: /usr/share/bash-completion/completions/ytmusic-tui
        file_info:
          mode: 0644
      - src: ./completions/ytmusic-tui.fish
        dst: /usr/share/fish/vendor_completions.d/ytmusic-tui.fish
        file_info:
          mode: 0644
      - src: ./completions/ytmusic-tui.zsh
        dst: /usr/share/zsh/vendor-completions/_ytmusic-tui
        file_info:
          mode: 0644

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - '^test:'
      - '^chore'
      - 'merge conflict'
      - Merge pull request
      - Merge remote-tracking branch
      - Merge branch
      - go mod tidy
  groups:
    - title: Dependency updates
      regexp: '^.*?(feat|fix)\(deps\)!?:.+$'
      order: 300
    - title: 'New Features'
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 100
    - title: 'Bug fixes'
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 200
    - title: 'Documentation updates'
      regexp: '^.*?doc(\([[:word:]]+\))??!?:.+$'
      order: 400
    - title: Other work
      order: 9999
